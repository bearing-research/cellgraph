name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same jobs on the tag it runs from.
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "latest"
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
      # Every check but the test suite lives in .pre-commit-config.yaml.
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure --color=always

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Git Bash on Windows, so every step is the same script on every OS.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "latest"
      - run: uv sync --locked

      # The package stands on its own: its first host must not be installed, or a
      # test could pass by reaching into it.
      - name: Assert Strata is absent
        run: |
          uv run python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("strata") is None, "strata unexpectedly installed"
          PY

      - run: uv run pytest -v -p no:cacheprovider
