name: Release

# A `v*` tag runs CI (ci.yml: the pre-commit checks and the suite on every
# supported Python) on the tagged commit, builds the wheel and sdist, publishes to
# TestPyPI via OIDC trusted publishing, then to PyPI after manual approval on the
# protected `pypi` environment.
#
# Trusted publishers must exist on PyPI and TestPyPI (Owner: bearing-research,
# Repo: cellgraph, Workflow: release.yml, Environment: testpypi / pypi).

on:
  push:
    tags:
      - 'v*'
  # Re-publish without re-tagging after a transient publish failure. Run it from the
  # tag ("Use workflow from: v0.1.0"), so this file and ci.yml are the tag's too.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0); must match the tag run from."
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The tag, pyproject.toml and CHANGELOG.md must agree
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          if not os.environ["GITHUB_REF"].startswith("refs/tags/v"):
              print(f"::error::run from a v* tag, not {os.environ['GITHUB_REF']}")
              sys.exit(1)
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if os.environ["EVENT_NAME"] == "workflow_dispatch" and os.environ["DISPATCH_VERSION"] != version:
              print(f"::error::version {os.environ['DISPATCH_VERSION']!r} is not the tag's {version!r}")
              sys.exit(1)
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if declared != version:
              print(f"::error::tag {version!r} does not match pyproject.toml version {declared!r}")
              sys.exit(1)
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if not re.search(rf"^##\s+{re.escape(version)}(?:\s|$)", changelog, re.MULTILINE):
              print(f"::error::CHANGELOG.md has no '## {version}' section")
              sys.exit(1)
          print(f"releasing {version}")
          PY

  # The tag publishes only what passes CI's own jobs on the tagged commit, whatever
  # CI said about the commit before.
  checks:
    name: CI on the tagged commit
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "latest"
      - run: uv build --out-dir dist
      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/cellgraph-*-py3-none-any.whl | head -1)
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install --index https://pypi.org/simple/ "${WHEEL}"
          /tmp/smoke/bin/python -c "
          import cellgraph as cg
          analysis = cg.analyze([cg.Cell('a', 'x = 1\\n'), cg.Cell('b', 'y = x + 1\\n')], cg.Vocabulary.core())
          assert analysis.dag.topological_order == ['a', 'b'], analysis.dag.topological_order
          print('cellgraph analyzes ok')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cellgraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Lets a workflow_dispatch re-run finish after a partial failure.
          skip-existing: true

  # The `pypi` environment needs a required reviewer; this job waits for
  # "Approve and deploy" in the run UI.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: testpypi
    environment:
      name: pypi
      url: https://pypi.org/p/cellgraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true
