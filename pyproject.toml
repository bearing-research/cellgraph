[project]
name = "cellgraph"
version = "0.1.0"
description = "The cell graph of a notebook or script: annotations with a host-supplied vocabulary, analysis, the DAG, and the keys that say whether a cell must run."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fangchen Li", email = "fangchen.li@outlook.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Stdlib only: a host brings its own vocabulary, analyzers and resolvers.
dependencies = []

[project.urls]
Homepage = "https://github.com/bearing-research/cellgraph"
Repository = "https://github.com/bearing-research/cellgraph"
Changelog = "https://github.com/bearing-research/cellgraph/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    # The derive_subkey test vector is computed with vestigo's own function; the
    # package never imports it.
    "vestigo==0.3.1",
    # The same ruff as .pre-commit-config.yaml.
    "ruff==0.17.1",
    "pre-commit>=4.0.0",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"

[tool.ty.environment]
python-version = "3.12"
python = ".venv"

[tool.ty.src]
include = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
